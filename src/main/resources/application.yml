server:
  port: ${PORT:8080}
spring:
  application:
    name: xingbao-family-platform
  datasource:
    url: jdbc:h2:file:./data/xingbao;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null
app:
  medical-disclaimer: "本平台内容仅供家庭互助与信息参考，不构成医疗诊断、治疗建议或疗效承诺。"
