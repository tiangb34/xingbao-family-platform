<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/><title>星宝家庭互助</title><link rel="stylesheet" href="./style.css?v=20260822-10"/></head><body><div class="app"><header><div class="header-copy"><small>星宝家庭互助</small><h1 id="greeting">记录每一点成长</h1><p>公益互助 · 隐私优先 · 合规内容</p></div><div class="header-art" aria-hidden="true"><i>★</i><span>☁</span><b>✦</b></div></header><main>
<section id="home" class="view active"><div class="hero"><div><em>☀ 今日陪伴</em><b>每一次小小进步，都值得被看见</b><span>用温柔的记录，留住属于星宝的成长时光。</span></div><div class="hero-art" aria-hidden="true">🌱</div></div><div id="account-tip" class="account-tip"></div><div class="section-title"><h2>陪伴工具</h2><span>慢慢来，也很棒</span></div><div class="grid"><button data-go="profile">星宝档案</button><button data-go="record">成长打卡</button><button data-go="knowledge">知识学习</button><button data-go="community">家长社区</button><button data-go="second">闲置互助</button><button data-go="tools">居家工具</button></div><p class="notice">平台内容仅供家庭互助与信息参考，不构成医疗诊断或治疗建议。</p></section>
<section id="account" class="view"><div id="account-profile" hidden><h2>我的</h2><div class="user-card"><div id="user-avatar" class="user-avatar">星</div><div><b id="user-name">—</b><p id="user-phone">—</p></div></div><div id="user-details" class="account-details"></div><button class="logout" onclick="logout()">退出当前账号</button></div><div id="account-auth"><h2>注册 / 登录</h2><form id="register-form"><input name="phone" placeholder="手机号码" required/><input name="nickname" placeholder="家长昵称" required/><label><input name="privacyConsent" type="checkbox" required/> 已阅读并同意隐私规则</label><label><input name="sensitiveConsent" type="checkbox"/> 同意处理儿童敏感信息</label><button>注册并开始使用</button></form><h3>已有账号</h3><form id="login-form"><input name="phone" placeholder="手机号码" required/><button>登录</button></form></div></section>
<section id="profile" class="view"><h2>星宝档案</h2><h3 id="profile-form-title">新建档案</h3><form id="profile-form"><input name="profileId" type="hidden"/><input name="nickname" placeholder="孩子昵称" required/><select name="gender"><option value="UNKNOWN">性别：未设置</option><option value="MALE">性别：男</option><option value="FEMALE">性别：女</option></select><input name="birthday" type="text" inputmode="numeric" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" title="请输入 YYYY-MM-DD 格式，例如 2020-05-18" placeholder="出生日期，例如 2020-05-18"/><input name="interventionYears" placeholder="干预年限（可选）"/><button id="profile-submit">保存档案</button><button id="profile-cancel" type="button" hidden>取消编辑</button></form><div id="children" class="cards"></div></section>
<section id="record" class="view"><h2>成长打卡</h2><form id="record-form"><select id="record-child" name="childId" required></select><select name="type"><option value="POSITIVE_BEHAVIOR">正向行为</option><option value="PROBLEM_BEHAVIOR">问题行为</option><option value="INTERVENTION">干预训练</option></select><input name="scene" placeholder="发生场景"/><input name="durationMinutes" type="number" placeholder="时长（分钟）"/><textarea name="resultNote" placeholder="记录结果或观察"></textarea><button>提交记录</button></form><div id="report" class="cards"></div></section>
<section id="knowledge" class="view"><h2>知识学习</h2><div id="contents" class="cards"></div><h3>投稿优质链接</h3><form id="content-form"><input name="title" placeholder="内容标题" required/><input name="sourceUrl" placeholder="来源链接" required/><input name="licenseBasis" placeholder="授权或许可说明" required/><textarea name="summary" placeholder="摘要"></textarea><button>提交审核</button></form></section>
<section id="community" class="view"><h2>家长社区</h2><form id="post-form"><input name="title" placeholder="标题" required/><textarea name="body" placeholder="分享你的经验或困惑" required></textarea><label class="image-picker"><span id="image-picker-text">添加图片（最多 2 张）</span><input id="post-images" name="images" type="file" accept="image/jpeg,image/png" multiple/></label><div id="post-image-preview" class="image-preview"></div><label><input name="anonymous" type="checkbox"/> 匿名发布</label><button>发布</button></form><div id="posts" class="cards"></div></section>
<section id="second" class="view"><h2>闲置教具互助</h2><p class="notice">仅提供信息展示与线下自主沟通；平台不参与支付、担保、物流或售后。</p><form id="listing-form"><input name="title" placeholder="教具名称" required/><textarea name="description" placeholder="物品说明"></textarea><input name="exchangeNeed" placeholder="置换需求"/><button>提交审核</button></form><div id="listings" class="cards"></div></section>
<section id="tools" class="view"><h2>居家干预工具</h2><div id="tools-list" class="cards"></div></section>
<section id="messages" class="view"><h2>站内消息</h2><div id="messages-list" class="cards"></div></section>
</main><nav><button data-go="home" class="selected"><i>⌂</i>首页</button><button data-go="profile"><i>★</i>档案</button><button data-go="community"><i>♡</i>互助</button><button data-go="tools"><i>☼</i>工具</button><button data-go="account"><i>◯</i>我的</button></nav></div><script src="./app.js?v=20260822-11"></script><script src="./training-cues.js?v=20260823-01"></script><script src="./training-progress.js?v=20260823-01"></script><script src="./learning-hub.js?v=20260824-01"></script><script src="./cognition-tool.js?v=20260825-01"></script><script src="./cognition-expanded.js?v=20260825-03"></script><script src="./cognition-dynamic.js?v=20260825-01"></script><script src="./tool-expanded.js?v=20260825-01"></script></body></html>
